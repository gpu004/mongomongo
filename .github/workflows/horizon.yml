name: horizon

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: horizon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: horizon/package-lock.json
      - name: Start MongoDB replica set
        run: |
          docker run -d --name horizon-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec horizon-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 2; done
          docker exec horizon-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do [ "$(docker exec horizon-mongo mongosh --quiet --eval 'rs.status().myState')" = "1" ] && break; sleep 2; done
      - name: Pull sandbox image
        run: docker pull node:24-alpine
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
      - run: node scripts/smoke-runner.ts
      - run: node src/cli.ts doctor --config mission.example.json
